<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="아리카 직원용 Gmail 서명 생성기. 이름과 연락처를 입력하고 완성된 서명을 복사하세요.">
  <title>아리카 Gmail 서명 생성기</title>
  <style>
    :root{--ink:#25282d;--muted:#616775;--line:#e3e5e9;--red:#c91b2d;--soft:#f6f7f9}
    *{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:Arial,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:14px;line-height:1.65}
    button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.65}button,input,textarea,a,[tabindex]{outline-offset:4px}:focus-visible{outline:3px solid #3974d2}
    .wrap{max-width:1120px;margin:0 auto;padding:40px 24px}.brand{letter-spacing:.1em;font-size:18px;font-weight:800;color:#5f6166;margin-bottom:15px}.brand span{color:var(--red)}
    h1{font-size:29px;line-height:1.35;letter-spacing:-.04em;margin:0 0 26px}h2{font-size:17px;margin:0}p{margin:0}.layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:22px;align-items:start}.layout>*{min-width:0}.panel{min-width:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.panelhead{padding:21px 24px;border-bottom:1px solid var(--line)}.form-body{padding:22px 24px}.field{margin-bottom:19px}.field:last-child{margin-bottom:0}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.required{color:var(--red);font-size:12px;font-weight:400}input,textarea{display:block;width:100%;min-width:0;border:1px solid #cbd0d8;border-radius:7px;padding:10px 11px;color:var(--ink);background:#fff}input::placeholder{color:#8a909c}input:focus,textarea:focus{border-color:#3974d2}textarea{resize:vertical;line-height:1.5;min-height:86px}.address-field{grid-column:1/-1}.email-fields{display:grid;grid-template-columns:minmax(0,1fr) 14px minmax(0,1.25fr);gap:6px;align-items:center}.email-fields input{padding:10px 8px;font-size:13px}.email-fields span{text-align:center;color:var(--muted)}.preview-scroll{overflow-x:auto;padding:32px 24px;background:#fff}.preview-scroll:focus-visible{outline-offset:-3px}#signature{display:table;min-width:100%;background:#fff}.actions{padding:20px 24px;border-top:1px solid var(--line)}.buttons{display:flex;gap:10px;flex-wrap:wrap}.primary,.secondary{display:inline-flex;align-items:center;justify-content:center;border-radius:7px;padding:11px 17px;min-height:44px;font-weight:700;text-decoration:none}.primary{background:var(--red);border:1px solid var(--red);color:white}.primary:hover{background:#ae1424}.secondary{background:white;border:1px solid #cbd0d8;color:#363c45}.secondary:hover{background:var(--soft)}#status{font-size:13px;min-height:22px;margin-top:10px;overflow-wrap:anywhere}#status[data-kind=error]{color:#ad1729}#status[data-kind=success]{color:#1a6f45}.steps{margin-top:20px;padding:20px 24px}.steps ol{margin:10px 0 0;padding-left:20px;color:#555d69}.steps li{padding-left:3px;margin-bottom:5px}.hint{font-size:12px;color:var(--muted);margin-top:12px}.noscript{margin-bottom:20px;background:#fff2f2;padding:16px;color:#a51826;border-radius:8px}
    @media(max-width:850px){.layout{grid-template-columns:1fr}.form-body{display:grid;grid-template-columns:1fr 1fr;gap:17px 20px}.field{margin:0}.wrap{padding-top:24px}}
    @media(max-width:520px){.wrap{padding:20px 14px}h1{font-size:25px}.panelhead,.form-body,.actions,.steps{padding:18px}.form-body{grid-template-columns:1fr}.preview-scroll{padding:25px 18px}.buttons>*{flex:1;padding:10px 12px}.buttons{gap:8px}}
  </style>
</head>
<body>
<main class="wrap">
  <div class="brand"><span>A</span>RICA</div>
  <h1>이메일 서명 만들기</h1>
  <noscript><p class="noscript">JavaScript를 허용해 주세요.</p></noscript>
  <div class="layout">
    <section class="panel" aria-labelledby="formTitle">
      <div class="panelhead"><h2 id="formTitle">내 정보</h2></div>
      <form id="employeeForm" class="form-body">
        <div class="field"><label for="employeeName">이름 <span class="required">필수</span></label><input id="employeeName" name="employeeName" autocomplete="name" maxlength="40" placeholder="이름" required></div>
        <div class="field"><label for="employeeRole">부서 · 직책</label><input id="employeeRole" name="employeeRole" autocomplete="organization-title" maxlength="80" placeholder="예: 개발팀 매니저"></div>
        <div class="field"><label for="employeePhone">전화번호</label><input id="employeePhone" name="employeePhone" type="tel" autocomplete="tel" placeholder="예: 010-0000-0000"></div>
        <div class="field"><label for="employeeEmailId">이메일</label><div class="email-fields"><input id="employeeEmailId" name="employeeEmailId" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="120" placeholder="아이디" aria-label="이메일 아이디"><span aria-hidden="true">@</span><input id="employeeEmailDomain" name="employeeEmailDomain" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="253" value="aricacorp.net" placeholder="도메인" aria-label="이메일 도메인"></div></div>
        <div class="field address-field"><label for="employeeAddress">주소</label><textarea id="employeeAddress" name="employeeAddress" autocomplete="street-address" maxlength="500" rows="3">(13449) 성남시 수정구 달래내로 46 성남글로벌융합센터 A동 505호</textarea></div>
      </form>
    </section>
    <div>
      <section class="panel" aria-labelledby="previewTitle">
        <div class="panelhead"><h2 id="previewTitle">서명 미리보기</h2></div>
        <div class="preview-scroll" tabindex="0" role="region" aria-label="서명 미리보기. 좁은 화면에서는 좌우로 스크롤할 수 있습니다."><div id="signature"></div></div>
        <div class="actions">
          <div class="buttons"><button type="button" id="copyButton" class="primary">서명 복사</button><a id="gmailSettingsLink" class="secondary" href="https://mail.google.com/mail/u/0/#settings/general" target="_blank" rel="noopener noreferrer" aria-label="Gmail 설정 열기 (새 탭)">Gmail 설정 열기 ↗</a></div>
          <p id="status" role="status" aria-live="polite"></p>
        </div>
      </section>
      <section class="panel steps" aria-labelledby="stepsTitle">
        <h2 id="stepsTitle">Gmail에 적용하기</h2>
        <ol>
          <li>설정을 열고 아래로 내려 <strong>서명 → 새로 만들기</strong>를 선택합니다.</li>
          <li>편집 칸에 붙여 넣습니다. <strong>Ctrl+V</strong> / Mac <strong>⌘V</strong></li>
          <li><strong>기본 서명</strong>을 지정하고 맨 아래 <strong>변경사항 저장</strong>을 누릅니다.</li>
        </ol>
        <p class="hint">컴퓨터 Gmail용 · 여러 계정 사용 시 적용할 계정을 확인하세요.</p>
      </section>
    </div>
  </div>
</main>

const ASSET_PATH = 'assets/arica-logo.png';
const $ = id => document.getElementById(id);
const form = $('employeeForm');
const signature = $('signature');
const inputIds = ['employeeName','employeeRole','employeePhone','employeeEmailId','employeeEmailDomain','employeeAddress'];
const pageIsPublicHttps = location.protocol === 'https:' && !isLocalHost(location.hostname);
const automaticLogo = pageIsPublicHttps ? new URL(ASSET_PATH, location.href).href : '';
let logoLoaded = false;
let logoLoading = false;
let copyInProgress = false;
const currentLogo = automaticLogo;
function isLocalHost(host) {
  const h = host.toLowerCase().replace(/^\[|\]$/g, '');
  return h === 'localhost' || h.endsWith('.localhost') || h === '::1' || h === '0.0.0.0' || /^127\./.test(h) || /^10\./.test(h) || /^192\.168\./.test(h) || /^172\.(1[6-9]|2\d|3[01])\./.test(h);
}
function escapeHtml(value) { return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Format recognized Korean domestic numbers without dropping unsupported input.
function formatPhone(value) {
  if (!/^[\d\s-]*$/.test(value)) return value;
  const digits = value.replace(/\D/g, '');
  let head;
  let max;
  let shortLength;
  if (/^(15|16|18)\d{2}/.test(digits)) {
    if (digits.length > 8) return value;
    return digits.length > 4 ? digits.slice(0, 4) + '-' + digits.slice(4) : digits;
  }
  if (digits.startsWith('02')) { head = 2; max = 10; shortLength = 9; }
  else if (/^050[2-8]/.test(digits)) { head = 4; max = 12; shortLength = 11; }
  else if (/^(01[016789]|0[3-6][1-5]|070|080|050)/.test(digits)) {
    // Only assigned geographic area codes are grouped.
    const prefix = digits.slice(0, 3);
    if (/^0[3-6]/.test(prefix) && !['031','032','033','041','042','043','044','051','052','053','054','055','061','062','063','064'].includes(prefix)) return value;
    head = 3; max = prefix === '080' ? 10 : 11; shortLength = 10;
  } else return value;
  if (digits.length > max) return value;
  if (digits.length <= head) return digits;
  const middle = digits.length > shortLength ? 4 : 3;
  const parts = [digits.slice(0, head), digits.slice(head, head + middle), digits.slice(head + middle)];
  return parts.filter(Boolean).join('-');
}
let previousPhone = '';
function updatePhone(event) {
  const input = $('employeePhone');
  const raw = input.value;
  const cursor = input.selectionStart;
  // Let Backspace/Delete remove a separator instead of immediately restoring it.
  const deletingSeparator = event.inputType?.startsWith('delete') && raw.replace(/\D/g, '') === previousPhone.replace(/\D/g, '');
  const formatted = deletingSeparator ? raw : formatPhone(raw);
  if (formatted !== raw) {
    const digitsBefore = raw.slice(0, cursor ?? raw.length).replace(/\D/g, '').length;
    input.value = formatted;
    if (cursor !== null && cursor !== undefined && input.setSelectionRange) {
      let next = 0, seen = 0;
      while (next < formatted.length && seen < digitsBefore) { if (/\d/.test(formatted[next])) seen++; next++; }
      input.setSelectionRange(next, next);
    }
  }
  previousPhone = input.value;
}
function updateEmail(id) {
  const local = $('employeeEmailId');
  const domain = $('employeeEmailDomain');
  if (id === 'employeeEmailId' && local.value.includes('@')) {
    const parts = local.value.trim().split('@');
    if (parts.length === 2) {
      local.value = parts[0];
      if (parts[1]) domain.value = parts[1];
      else { domain.focus(); domain.select?.(); }
    }
  } else if (id === 'employeeEmailDomain' && domain.value.startsWith('@')) {
    domain.value = domain.value.slice(1);
  }
}
function values() {
  const v = Object.fromEntries(inputIds.map(id => [id, $(id).value.trim()]));
  v.employeeEmail = v.employeeEmailId ? v.employeeEmailId + '@' + v.employeeEmailDomain : '';
  return v;
}
function render() {
  const v = values();
  const example = !inputIds.filter(id => !['employeeEmailDomain','employeeAddress'].includes(id)).some(id => v[id]);
  const name = example ? '이름' : (v.employeeName || '이름');
  const role = example ? '부서 · 직책' : v.employeeRole;
  const phone = example ? '010-0000-0000' : v.employeePhone;
  const email = example ? 'name@aricacorp.net' : v.employeeEmail;
  const src = currentLogo || LOCAL_LOGO;
  const image = `<img src="${escapeHtml(src)}" width="148" height="115" alt="ARICA 로고" style="display:block;width:148px;height:auto;border:0;max-width:148px">`;
  const phoneRow = phone ? `<div><strong>Tel.</strong> ${escapeHtml(phone)}</div>` : '';
  const emailRow = email ? `<div><strong>E-Mail.</strong> <a href="mailto:${escapeHtml(encodeURIComponent(email).replace(/%40/gi,'@'))}" style="color:#292929;text-decoration:none">${escapeHtml(email)}</a></div>` : '';
  const addressRow = v.employeeAddress ? `<div style="overflow-wrap:anywhere"><strong>Add.</strong> ${escapeHtml(v.employeeAddress).replace(/\r?\n/g, '<br>')}</div>` : '';
  signature.innerHTML = `<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;background:#ffffff;font-family:Arial,'Malgun Gothic',sans-serif;color:#292929;"><tbody><tr><td style="width:160px;min-width:160px;vertical-align:middle;padding:0 24px 0 0;text-align:center">${image}</td><td style="vertical-align:middle;padding:0;min-width:330px;font-size:13px;line-height:1.8;white-space:normal;"><div style="margin-bottom:5px;font-size:15px"><strong>${COMPANY}</strong></div><div><strong>${escapeHtml(name)}${role ? ' |' : ''}</strong>${role ? ' '+escapeHtml(role) : ''}</div>${phoneRow}${emailRow}${addressRow}</td></tr></tbody></table>`;
}
function status(message, kind = '') { $('status').textContent = message; $('status').dataset.kind = kind; }
function loadLogo() {
  render();

  logoLoading = true;
  const img = signature.querySelector('img');
  function done(ok) { logoLoaded = ok; logoLoading = false; }
  img.addEventListener('load', () => done(img.naturalWidth > 0), {once:true});
  img.addEventListener('error', () => done(false), {once:true});
  if (img.complete) done(img.naturalWidth > 0);
}
function readyToCopy() {

  if (!form.reportValidity()) { status('입력 형식을 확인해 주세요.', 'error'); return false; }
  const email = values().employeeEmail;
  if (email && !/^[^\s@]+@(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?\.)+[a-zA-Z]{2,63}$/.test(email)) {
